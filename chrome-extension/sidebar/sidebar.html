<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      min-height: 100vh;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
    }
    h2 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .creator-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .creator-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
    }
    .creator-row button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #7b2ff7;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .creator-row button:hover { background: #6a1fe0; }
    .chat-list { display: flex; flex-direction: column; gap: 8px; }
    .chat-item {
      padding: 10px;
      background: #16213e;
      border-radius: 8px;
      border: 1px solid #222;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .chat-fan-id {
      font-weight: 600;
      font-size: 13px;
      color: #00d4ff;
    }
    .chat-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #999;
    }
    .heat-score {
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 11px;
    }
    .heat-low { background: #1a3a1a; color: #44ff44; }
    .heat-mid { background: #3a3a1a; color: #ffaa00; }
    .heat-high { background: #3a1a1a; color: #ff4444; }
    .takeover-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
    }
    .takeover-toggle label { cursor: pointer; color: #aaa; }
    .takeover-toggle input { cursor: pointer; }
    .empty-state {
      text-align: center;
      color: #555;
      font-size: 13px;
      padding: 20px;
    }
    .stats-bar {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: #16213e;
      border-radius: 8px;
      border: 1px solid #222;
    }
    .stat {
      flex: 1;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #00d4ff;
    }
    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h2>Aura Dashboard</h2>

  <div class="section">
    <div class="section-title">Creator</div>
    <div class="creator-row">
      <input type="text" id="creator-input" placeholder="Creator ID..." />
      <button id="set-creator">Imposta</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Chat attive</div>
    <div id="chat-list" class="chat-list">
      <div class="empty-state">Nessuna chat attiva</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Statistiche</div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-messages">0</div>
        <div class="stat-label">Messaggi</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-conversions">0</div>
        <div class="stat-label">Conversioni</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-revenue">$0</div>
        <div class="stat-label">Revenue</div>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
