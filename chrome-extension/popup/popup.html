<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura OF Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 200px;
      min-height: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider { background: #00d4ff; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .info-row {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a2e;
    }
    .info-row strong { color: #ccc; }
    .sidebar-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #00d4ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .sidebar-link:hover { text-decoration: underline; }
    .token-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1a1a2e;
    }
    .token-section label {
      font-size: 11px;
      color: #888;
      display: block;
      margin-bottom: 4px;
    }
    .token-section input {
      width: 100%;
      padding: 6px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 12px;
    }
    .token-section button {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      border: none;
      border-radius: 4px;
      background: #7b2ff7;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .token-section button:hover { background: #6a1fe0; }
    #token-msg { font-size: 11px; color: #44ff44; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AURA</div>
  </div>
  <div class="toggle-row">
    <span id="toggle-label" class="toggle-label">Bot attivo</span>
    <label class="switch">
      <input type="checkbox" id="bot-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="info-row">Creator: <strong id="creator-name">Non configurato</strong></div>
  <div class="info-row">Messaggi oggi: <strong id="msg-count">0</strong></div>
  <a class="sidebar-link" id="open-sidebar">Apri sidebar &rarr;</a>
  <div class="token-section" id="token-section">
    <label for="token-input">API Token</label>
    <input type="password" id="token-input" placeholder="Inserisci token..." />
    <button id="save-token">Salva</button>
    <div id="token-msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
