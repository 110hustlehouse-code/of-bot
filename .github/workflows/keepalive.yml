name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 */2 * *'   # ogni 2 giorni alle 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.aurafullsuite.it/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@invalid.local","password":"x"}')
          echo "Risposta: $code"
          if [ "$code" = "401" ]; then
            echo "Database sveglio."
          else
            echo "Attenzione: risposta inattesa ($code)"
            exit 1
          fi
